<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本体论 · 自媒体流量获客截留业务 · 知识图谱</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #f5f7fa;
            color: #2c3e50;
            overflow: hidden;
        }
        
        /* 左侧工具栏 */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 260px;
            height: 100vh;
            background: #ffffff;
            border-right: 1px solid #e1e5e9;
            padding: 24px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 2px 0 8px rgba(0,0,0,0.05);
        }
        
        .sidebar h1 {
            font-size: 20px;
            color: #2c3e50;
            margin-bottom: 4px;
            font-weight: 600;
        }
        
        .sidebar .subtitle {
            font-size: 13px;
            color: #7f8c8d;
            margin-bottom: 24px;
        }
        
        /* 搜索框 */
        .search-box {
            margin-bottom: 24px;
        }
        
        .search-box input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e1e5e9;
            border-radius: 8px;
            background: #f8f9fa;
            color: #2c3e50;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .search-box input:focus {
            outline: none;
            border-color: #3498db;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(52,152,219,0.1);
        }
        
        /* 分组 */
        .section {
            margin-bottom: 24px;
        }
        
        .section h3 {
            font-size: 12px;
            color: #7f8c8d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            font-weight: 500;
        }
        
        /* 实体类型筛选 */
        .filter-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            margin-bottom: 4px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .filter-item:hover {
            background: #f8f9fa;
        }
        
        .filter-item.active {
            background: #f8f9fa;
        }
        
        .filter-color {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #fff;
            border: 2px solid rgba(0,0,0,0.1);
        }
        
        .filter-item label {
            font-size: 14px;
            color: #2c3e50;
            cursor: pointer;
        }
        
        .filter-item .count {
            margin-left: auto;
            font-size: 12px;
            color: #7f8c8d;
            background: #f0f0f0;
            padding: 2px 8px;
            border-radius: 10px;
        }
        
        /* 操作按钮 */
        .action-btn {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 8px;
            border: 1px solid #e1e5e9;
            border-radius: 8px;
            background: #ffffff;
            color: #2c3e50;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .action-btn:hover {
            background: #3498db;
            border-color: #3498db;
            color: #ffffff;
        }
        
        .action-btn.primary {
            background: #3498db;
            border-color: #3498db;
            color: #ffffff;
        }
        
        .action-btn.primary:hover {
            background: #2980b9;
        }
        
        /* 节点详情面板 */
        .node-detail {
            position: fixed;
            right: 24px;
            top: 24px;
            width: 380px;
            max-height: calc(100vh - 48px);
            background: #ffffff;
            border: 1px solid #e1e5e9;
            border-radius: 12px;
            padding: 24px;
            z-index: 100;
            display: none;
            overflow-y: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        
        .node-detail.active {
            display: block;
        }
        
        .node-detail-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .node-detail-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            font-size: 20px;
            color: #fff;
        }
        
        .node-detail h2 {
            font-size: 18px;
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .node-detail .type-tag {
            font-size: 12px;
            color: #7f8c8d;
            padding: 4px 12px;
            background: #f0f0f0;
            border-radius: 12px;
        }
        
        .node-detail .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: #7f8c8d;
            font-size: 24px;
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .node-detail .close-btn:hover {
            background: #f0f0f0;
            color: #e74c3c;
        }
        
        .node-detail .property-group {
            margin-bottom: 16px;
        }
        
        .node-detail .property-label {
            font-size: 11px;
            color: #7f8c8d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        
        .node-detail .property-value {
            font-size: 14px;
            color: #2c3e50;
            padding: 10px 14px;
            background: #f8f9fa;
            border-radius: 8px;
            line-height: 1.5;
        }
        
        .node-detail .relations-section {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #e1e5e9;
        }
        
        .node-detail .relations-section h3 {
            font-size: 14px;
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 12px;
        }
        
        .node-detail .relation-item {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .node-detail .relation-item:hover {
            background: #3498db;
            color: #ffffff;
        }
        
        .node-detail .relation-arrow {
            margin-right: 8px;
            font-size: 12px;
        }
        
        /* 主可视化区域 */
        .visualization {
            position: fixed;
            left: 260px;
            top: 0;
            right: 0;
            bottom: 0;
        }
        
        /* 圆形节点样式 */
        .node-circle {
            cursor: pointer;
        }
        
        /* 连线样式 */
        .link {
            fill: none;
            stroke: #95a5a6;
            stroke-width: 2;
            stroke-opacity: 0.5;
        }
        
        .link.highlighted {
            stroke: #3498db;
            stroke-width: 3;
            stroke-opacity: 1;
        }
        
        /* 连线标签背景 */
        .link-label-bg {
            fill: #ffffff;
            stroke: #e1e5e9;
            stroke-width: 1;
        }
        
        .link-label {
            font-size: 11px;
            fill: #5a6c7d;
            pointer-events: none;
        }
        
        /* 节点圆形 */
        .node-bg {
            transition: stroke-width 0.2s, stroke 0.2s;
        }
        
        /* 底部提示 */
        .tip-bar {
            position: fixed;
            bottom: 24px;
            left: 280px;
            right: 24px;
            background: #ffffff;
            padding: 12px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #7f8c8d;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .tip-bar .tip-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        /* 统计卡片 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-card .stat-number {
            font-size: 20px;
            font-weight: 600;
            color: #2c3e50;
        }
        
        .stat-card .stat-label {
            font-size: 11px;
            color: #7f8c8d;
            margin-top: 2px;
        }
        
        /* Agent颜色方案 */
        .color-dawa { background: #f39c12; }  /* 大娃 - 橙色 */
        .color-erwa { background: #27ae60; }  /* 二娃 - 绿色 */
        .color-shared { background: #3498db; }  /* 共用资源 - 蓝色 */
        
        /* Agent说明区块 */
        .agent-section {
            margin-top: 24px;
            padding: 16px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .agent-section h4 {
            font-size: 12px;
            color: #2c3e50;
            margin-bottom: 12px;
            font-weight: 600;
        }
        
        .agent-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-size: 11px;
            color: #7f8c8d;
        }
        
        .agent-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            margin-right: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 8px;
        }
        
        .agent-list {
            margin-top: 4px;
            font-size: 10px;
            color: #95a5a6;
        }
    </style>
</head>
<body>
    <!-- 左侧工具栏 -->
    <div class="sidebar">
        <h1>本体论知识图谱</h1>
        <p class="subtitle">自媒体流量获客截留业务</p>
        
        <!-- 统计 -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number">14</div>
                <div class="stat-label">实体</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">17</div>
                <div class="stat-label">关系</div>
            </div>
        </div>
        
        <!-- 搜索 -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="搜索实体..." />
        </div>
        
        <!-- Agent筛选 -->
        <div class="section">
            <h3>Agent负责领域</h3>
            <div class="filter-item active" data-agent="dawa">
                <div class="filter-color color-dawa">🤖</div>
                <label>大娃Agent</label>
                <span class="count">9</span>
            </div>
            <div class="filter-item active" data-agent="erwa">
                <div class="filter-color color-erwa">🤖</div>
                <label>二娃Agent</label>
                <span class="count">3</span>
            </div>
            <div class="filter-item active" data-agent="shared">
                <div class="filter-color color-shared">共用</div>
                <label>共用资源</label>
                <span class="count">2</span>
            </div>
        </div>
        
        <!-- 操作 -->
        <div class="section">
            <h3>操作</h3>
            <button class="action-btn primary" onclick="resetView()">
                <span>↻</span> 重置布局
            </button>
            <button class="action-btn" onclick="highlightPath()">
                <span>✦</span> 高亮业务路径
            </button>
            <button class="action-btn" onclick="exportData()">
                <span>↓</span> 导出数据
            </button>
        </div>
        
        <!-- Agent说明 -->
        <div class="agent-section">
            <h4>Agent职责边界</h4>
            <div class="agent-item">
                <div class="agent-dot color-dawa">🤖</div>
                <span>大娃Agent - 挖掘域</span>
            </div>
            <div class="agent-list">
                KOL、帖子、评论行为、评论内容<br/>
                采集用户、验证策略、挖掘策略、结构化输出
            </div>
            <div class="agent-item" style="margin-top: 12px;">
                <div class="agent-dot color-erwa">🤖</div>
                <span>二娃Agent - 触达域</span>
            </div>
            <div class="agent-list">
                触达用户、触达策略、触达记录
            </div>
            <div class="agent-item" style="margin-top: 12px;">
                <div class="agent-dot color-shared">共用</div>
                <span>共用资源 - 账号/IP</span>
            </div>
            <div class="agent-list">
                自媒体账号矩阵、IP矩阵
            </div>
            <div style="margin-top: 16px; padding-top: 12px; border-top: 1px solid #e1e5e9;">
                <div style="font-size: 11px; color: #e74c3c; font-weight: 500;">
                    🔄 边界：采集用户 → 触达用户
                </div>
                <div style="font-size: 10px; color: #95a5a6; margin-top: 4px;">
                    已验证的采集用户转化为触达用户
                </div>
            </div>
        </div>
    </div>
    
    <!-- 节点详情面板 -->
    <div class="node-detail" id="nodeDetail">
        <button class="close-btn" onclick="closeDetail()">×</button>
        <div class="node-detail-header">
            <div class="node-detail-icon" id="detailIcon"></div>
            <div>
                <h2 id="detailTitle">节点名称</h2>
                <div class="type-tag" id="detailType">类型</div>
            </div>
        </div>
        <div id="detailContent"></div>
    </div>
    
    <!-- 主可视化区域 -->
    <div class="visualization" id="visualization"></div>
    
    <!-- 底部提示 -->
    <div class="tip-bar">
        <div class="tip-item">
            <span>🤖</span> 橙色=大娃 · 绿色=二娃
        </div>
        <div class="tip-item">
            <span>🖱️</span> 拖拽移动 · 滚轮缩放
        </div>
        <div class="tip-item">
            <span>👆</span> 点击查看详情
        </div>
    </div>
    
    <script>
        // 实体数据 - 按Agent负责分类
        const nodes = [
            // 大娃Agent负责 - 挖掘域 (橙色)
            { id: "kol", name: "KOL", agent: "dawa", description: "流量源头", icon: "📢", properties: { 定义: "意见领袖，拥有粉丝和影响力", 作用: "流量来源，帖子的发布者", 负责: "大娃Agent" } },
            { id: "post", name: "帖子", agent: "dawa", description: "内容载体", icon: "📝", properties: { 定义: "KOL发布的内容", 作用: "承载评论，发现用户的入口", 负责: "大娃Agent" } },
            { id: "comment_act", name: "评论行为", agent: "dawa", description: "消费行为", icon: "💬", properties: { 定义: "用户对帖子的评论行为", 包含: "谁、何时、对哪个帖子", 负责: "大娃Agent" } },
            { id: "comment_content", name: "评论内容", agent: "dawa", description: "行为结果", icon: "📄", properties: { 定义: "评论的具体内容", 属性: "意图评分、意图状态、语义标签", 作用: "分析用户意图的基础", 负责: "大娃Agent" } },
            { id: "collect_user", name: "采集用户", agent: "dawa", description: "挖掘域", icon: "👤", properties: { 状态: "待清洗 → 待分配 → 已验证 → 待人工 → 已过滤", 属性: "契合度", 负责Agent: "大娃", 阶段: "挖掘域", 边界: "已验证后转化为触达用户" } },
            { id: "verify_strategy", name: "验证策略", agent: "dawa", description: "自动验证", icon: "✓", properties: { 定义: "verify_users.py", 作用: "验证用户真实性", 方式: "浏览器访问主页评估活跃度", 负责: "大娃Agent" } },
            { id: "dig_strategy", name: "挖掘策略", agent: "dawa", description: "统一策略", icon: "⛏", properties: { 定义: "发现目标的顶层策略", 包含: "采集、清洗、加工（现阶段统一）", 输出: "结构化输出", 负责: "大娃Agent" } },
            { id: "struct_output", name: "结构化输出", agent: "dawa", description: "能力+结果", icon: "📊", properties: { 定义: "挖掘策略的输出", 形态: "用户画像、数据产品", 作用: "数据产品化", 负责: "大娃Agent" } },
            { id: "traffic", name: "流量", agent: "dawa", description: "业务结果", icon: "📈", properties: { 定义: "最终业务目标", 作用: "获客转化的结果（归因到KOL）", 注意: "由触达用户转化产生" } },
            
            // 二娃Agent负责 - 触达域 (绿色)
            { id: "touch_user", name: "触达用户", agent: "erwa", description: "触达域", icon: "🎯", properties: { 状态: "已分配 → 已触达 → 已转化 → 已关闭", 属性: "信任度、归因", 负责Agent: "二娃", 阶段: "触达域", 来源: "由采集用户转化" } },
            { id: "touch_strategy", name: "触达策略", agent: "erwa", description: "触达方式", icon: "🎬", properties: { 定义: "触达用户的策略方式", 包含: "账号绑定、IP绑定、话术、时机、行为方式、人设", MVP阶段: "与剧本合一", 负责: "二娃Agent" } },
            { id: "touch_record", name: "触达记录", agent: "erwa", description: "执行记录", icon: "📋", properties: { 定义: "每次触达动作", 包含: "触达用户ID、执行账号、执行时间、话术内容", 属性: "效果（是否回复、是否转化）", 负责: "二娃Agent" } },
            
            // 共用资源 (蓝色)
            { id: "account_matrix", name: "账号矩阵", agent: "shared", description: "账号资源", icon: "📱", properties: { 定义: "具体的社媒账号资源", 用途: "触达时使用的账号", 包含: "小红书账号、抖音账号等", 使用者: "二娃Agent调用" } },
            { id: "ip_matrix", name: "IP矩阵", agent: "shared", description: "网络IP", icon: "🌐", properties: { 定义: "网络IP资源", 用途: "触达时绑定的IP", 作用: "防止账号被封", 使用者: "二娃Agent调用" } }
        ];
        
        // 关系数据
        const links = [
            { source: "kol", target: "post", label: "拥有", agent: "dawa" },
            { source: "post", target: "comment_act", label: "承载", agent: "dawa" },
            { source: "comment_act", target: "comment_content", label: "产生", agent: "dawa" },
            { source: "comment_content", target: "collect_user", label: "意图分类", agent: "dawa" },
            { source: "dig_strategy", target: "post", label: "爬取", agent: "dawa" },
            { source: "dig_strategy", target: "collect_user", label: "发现", agent: "dawa" },
            { source: "dig_strategy", target: "struct_output", label: "输出", agent: "dawa" },
            { source: "collect_user", target: "verify_strategy", label: "验证", agent: "dawa" },
            { source: "collect_user", target: "touch_user", label: "转化边界", agent: "boundary" },
            { source: "dig_strategy", target: "account_matrix", label: "使用", agent: "dawa" },
            { source: "dig_strategy", target: "ip_matrix", label: "使用", agent: "dawa" },
            { source: "touch_strategy", target: "account_matrix", label: "绑定", agent: "erwa" },
            { source: "touch_strategy", target: "ip_matrix", label: "绑定", agent: "erwa" },
            { source: "touch_strategy", target: "touch_user", label: "执行", agent: "erwa" },
            { source: "touch_user", target: "touch_record", label: "产生", agent: "erwa" },
            { source: "touch_user", target: "traffic", label: "转化", agent: "erwa" },
            { source: "touch_user", target: "kol", label: "归因", agent: "erwa" }
        ];
        
        // Agent颜色映射
        const agentColorMap = {
            dawa: "#f39c12",   // 大娃 - 橙色
            erwa: "#27ae60",   // 二娃 - 绿色
            shared: "#3498db"  // 共用 - 蓝色
        };
        
        // 初始化SVG
        const width = window.innerWidth - 260;
        const height = window.innerHeight - 60;
        
        const svg = d3.select("#visualization")
            .append("svg")
            .attr("width", width)
            .attr("height", height);
        
        // 缩放功能
        const zoom = d3.zoom()
            .scaleExtent([0.3, 2])
            .on("zoom", (event) => {
                mainGroup.attr("transform", event.transform);
            });
        
        svg.call(zoom);
        
        const mainGroup = svg.append("g");
        
        // 创建力导向图
        const simulation = d3.forceSimulation(nodes)
            .force("link", d3.forceLink(links).id(d => d.id).distance(180))
            .force("charge", d3.forceManyBody().strength(-500))
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("collision", d3.forceCollide().radius(70))
            .on("tick", ticked);
        
        // 边界约束
        simulation.force("bounds", () => {
            nodes.forEach(d => {
                d.x = Math.max(70, Math.min(width - 70, d.x));
                d.y = Math.max(70, Math.min(height - 70, d.y));
            });
        });
        
        // 绘制连线（使用曲线）
        const link = mainGroup.append("g")
            .selectAll("path")
            .data(links)
            .enter()
            .append("path")
            .attr("class", "link")
            .attr("stroke", d => {
                if (d.agent === "boundary") return "#e74c3c"; // 边界关系 - 红色
                return agentColorMap[d.agent] || "#95a5a6";
            })
            .attr("stroke-width", d => d.agent === "boundary" ? 4 : 2)
            .attr("stroke-opacity", d => d.agent === "boundary" ? 1 : 0.5)
            .attr("id", d => `link-${d.source.id || d.source}-${d.target.id || d.target}`);
        
        // 绘制连线标签背景
        const linkLabelBg = mainGroup.append("g")
            .selectAll("rect")
            .data(links)
            .enter()
            .append("rect")
            .attr("class", "link-label-bg")
            .attr("width", d => d.label.length * 8 + 16)
            .attr("height", 20)
            .attr("rx", 4)
            .attr("fill", d => {
                if (d.agent === "boundary") return "#ffebee";
                return "#ffffff";
            })
            .attr("stroke", d => {
                if (d.agent === "boundary") return "#e74c3c";
                return "#e1e5e9";
            });
        
        // 绘制连线标签
        const linkLabel = mainGroup.append("g")
            .selectAll("text")
            .data(links)
            .enter()
            .append("text")
            .attr("class", "link-label")
            .attr("text-anchor", "middle")
            .attr("dy", 4)
            .attr("fill", d => d.agent === "boundary" ? "#e74c3c" : "#5a6c7d")
            .attr("font-weight", d => d.agent === "boundary" ? "600" : "400")
            .text(d => d.label);
        
        // 绘制圆形节点
        const node = mainGroup.append("g")
            .selectAll("g")
            .data(nodes)
            .enter()
            .append("g")
            .attr("class", "node-circle")
            .attr("id", d => `node-${d.id}`)
            .call(d3.drag()
                .on("start", dragStarted)
                .on("drag", dragged)
                .on("end", dragEnded))
            .on("click", showDetail);
        
        // 圆形背景
        node.append("circle")
            .attr("class", "node-bg")
            .attr("r", 50)
            .attr("fill", d => agentColorMap[d.agent])
            .attr("stroke", "#ffffff")
            .attr("stroke-width", 4);
        
        // Agent标识（小圆圈）
        node.append("circle")
            .attr("r", 12)
            .attr("cx", 40)
            .attr("cy", -40)
            .attr("fill", d => agentColorMap[d.agent])
            .attr("stroke", "#ffffff")
            .attr("stroke-width", 2);
        
        // Agent标识文字
        node.append("text")
            .attr("x", 40)
            .attr("y", -36)
            .attr("text-anchor", "middle")
            .attr("fill", "#ffffff")
            .attr("font-size", "9px")
            .text(d => {
                if (d.agent === "dawa") return "大";
                if (d.agent === "erwa") return "二";
                return "共";
            });
        
        // 图标
        node.append("text")
            .attr("class", "node-icon")
            .attr("dy", -6)
            .attr("text-anchor", "middle")
            .attr("fill", "#ffffff")
            .attr("font-size", "20px")
            .text(d => d.icon);
        
        // 实体名称
        node.append("text")
            .attr("class", "node-name")
            .attr("dy", 18)
            .attr("text-anchor", "middle")
            .attr("fill", "#ffffff")
            .attr("font-size", "13px")
            .attr("font-weight", "600")
            .text(d => d.name);
        
        // Agent标签（节点外）
        node.append("text")
            .attr("class", "node-desc")
            .attr("dy", 68)
            .attr("text-anchor", "middle")
            .attr("fill", d => agentColorMap[d.agent])
            .attr("font-size", "11px")
            .attr("font-weight", "500")
            .text(d => {
                if (d.agent === "dawa") return "🤖 大娃";
                if (d.agent === "erwa") return "🤖 二娃";
                return "共用";
            });
        
        // 更新位置函数
        function ticked() {
            // 曲线连线
            link.attr("d", d => {
                const dx = d.target.x - d.source.x;
                const dy = d.target.y - d.source.y;
                const midX = (d.source.x + d.target.x) / 2;
                const midY = (d.source.y + d.target.y) / 2;
                
                return `M${d.source.x},${d.source.y} 
                        Q${midX + dy * 0.3},${midY - dx * 0.3} 
                        ${d.target.x},${d.target.y}`;
            });
            
            // 更新标签位置
            linkLabelBg
                .attr("x", d => (d.source.x + d.target.x) / 2 - d.label.length * 4 - 8)
                .attr("y", d => (d.source.y + d.target.y) / 2 - 10);
            
            linkLabel
                .attr("x", d => (d.source.x + d.target.x) / 2)
                .attr("y", d => (d.source.y + d.target.y) / 2);
            
            node.attr("transform", d => `translate(${d.x},${d.y})`);
        }
        
        // 拖拽函数
        function dragStarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }
        
        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }
        
        function dragEnded(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }
        
        // 显示节点详情
        function showDetail(event, d) {
            event.stopPropagation();
            
            const detail = document.getElementById("nodeDetail");
            const icon = document.getElementById("detailIcon");
            const title = document.getElementById("detailTitle");
            const type = document.getElementById("detailType");
            const content = document.getElementById("detailContent");
            
            icon.textContent = d.icon;
            icon.className = `node-detail-icon color-${d.agent}`;
            title.textContent = d.name;
            type.textContent = d.agent === "dawa" ? "🤖 大娃Agent负责" : 
                               d.agent === "erwa" ? "🤖 二娃Agent负责" : "共用资源";
            
            let html = '';
            
            if (d.properties) {
                for (const [key, value] of Object.entries(d.properties)) {
                    html += `
                        <div class="property-group">
                            <div class="property-label">${key}</div>
                            <div class="property-value">${value}</div>
                        </div>
                    `;
                }
            }
            
            // 显示关系
            const relations = links.filter(l => l.source.id === d.id || l.target.id === d.id);
            if (relations.length > 0) {
                html += `
                    <div class="relations-section">
                        <h3>相关关系 (${relations.length})</h3>
                `;
                
                relations.forEach(r => {
                    const targetName = r.source.id === d.id ? r.target.name : r.source.name;
                    const arrow = r.source.id === d.id ? "→" : "←";
                    const isBoundary = r.agent === "boundary";
                    html += `
                        <div class="relation-item" onclick="highlightNode('${r.source.id === d.id ? r.target.id : r.source.id}')"
                             style="${isBoundary ? 'background: #ffebee; color: #e74c3c;' : ''}">
                            <span class="relation-arrow">${arrow}</span>
                            <span>${r.label} ${targetName}${isBoundary ? ' (边界)' : ''}</span>
                        </div>
                    `;
                });
                
                html += "</div>";
            }
            
            content.innerHTML = html;
            detail.classList.add("active");
            
            // 高亮当前节点
            highlightNode(d.id);
        }
        
        // 关闭详情
        function closeDetail() {
            document.getElementById("nodeDetail").classList.remove("active");
            resetHighlight();
        }
        
        // 高亮节点
        function highlightNode(nodeId) {
            d3.selectAll(".node-bg")
                .attr("stroke-width", d => d.id === nodeId ? 6 : 4)
                .attr("stroke", d => d.id === nodeId ? "#2c3e50" : "#ffffff");
            
            d3.selectAll(".link")
                .attr("stroke-width", d => (d.source.id === nodeId || d.target.id === nodeId) ? 4 : 2)
                .attr("stroke-opacity", d => (d.source.id === nodeId || d.target.id === nodeId) ? 1 : 0.3);
        }
        
        // 重置高亮
        function resetHighlight() {
            d3.selectAll(".node-bg")
                .attr("stroke-width", 4)
                .attr("stroke", "#ffffff");
            
            d3.selectAll(".link")
                .attr("stroke-width", d => d.agent === "boundary" ? 4 : 2)
                .attr("stroke-opacity", d => d.agent === "boundary" ? 1 : 0.5);
        }
        
        // 重置视图
        function resetView() {
            svg.transition()
                .duration(500)
                .call(zoom.transform, d3.zoomIdentity);
            
            simulation.alpha(1).restart();
            closeDetail();
        }
        
        // 高亮路径
        function highlightPath() {
            const pathNodes = ["kol", "post", "comment_act", "comment_content", "collect_user", "touch_user", "traffic"];
            
            d3.selectAll(".node-bg")
                .attr("stroke-width", d => pathNodes.includes(d.id) ? 6 : 2)
                .attr("stroke", d => pathNodes.includes(d.id) ? "#2c3e50" : "#e0e0e0")
                .attr("fill-opacity", d => pathNodes.includes(d.id) ? 1 : 0.5);
            
            d3.selectAll(".node-circle")
                .attr("opacity", d => pathNodes.includes(d.id) ? 1 : 0.4);
            
            d3.selectAll(".link")
                .attr("stroke-width", d => (pathNodes.includes(d.source.id) && pathNodes.includes(d.target.id)) ? 4 : 1)
                .attr("stroke-opacity", d => (pathNodes.includes(d.source.id) && pathNodes.includes(d.target.id)) ? 1 : 0.2);
        }
        
        // 导出数据
        function exportData() {
            const data = {
                nodes: nodes,
                links: links.map(l => ({
                    source: l.source.id || l.source,
                    target: l.target.id || l.target,
                    label: l.label,
                    agent: l.agent
                }))
            };
            
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "本体论-知识图谱数据.json";
            a.click();
            URL.revokeObjectURL(url);
        }
        
        // 搜索功能
        document.getElementById("searchInput").addEventListener("input", function(e) {
            const searchTerm = e.target.value.toLowerCase();
            
            d3.selectAll(".node-circle")
                .attr("opacity", d => d.name.toLowerCase().includes(searchTerm) || searchTerm === "" ? 1 : 0.3);
            
            d3.selectAll(".link")
                .attr("stroke-opacity", d => {
                    const sourceMatch = d.source.name && d.source.name.toLowerCase().includes(searchTerm);
                    const targetMatch = d.target.name && d.target.name.toLowerCase().includes(searchTerm);
                    return (sourceMatch || targetMatch || searchTerm === "") ? 0.5 : 0.15;
                });
        });
        
        // Agent筛选
        document.querySelectorAll(".filter-item[data-agent]").forEach(item => {
            item.addEventListener("click", function() {
                this.classList.toggle("active");
                
                const activeAgents = [];
                document.querySelectorAll(".filter-item[data-agent].active").forEach(active => {
                    activeAgents.push(active.dataset.agent);
                });
                
                d3.selectAll(".node-circle")
                    .attr("opacity", d => activeAgents.includes(d.agent) ? 1 : 0.3);
                
                d3.selectAll(".link")
                    .attr("stroke-opacity", d => {
                        if (d.agent === "boundary") return 1;
                        const sourceActive = activeAgents.includes(d.source.agent);
                        const targetActive = activeAgents.includes(d.target.agent);
                        return (sourceActive && targetActive) ? 0.5 : 0.15;
                    });
            });
        });
        
        // 点击空白关闭详情
        svg.on("click", function(event) {
            if (event.target === this) {
                closeDetail();
            }
        });
    </script>
</body>
</html>
