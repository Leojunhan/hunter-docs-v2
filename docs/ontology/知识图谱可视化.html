<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本体论 · 自媒体流量获客截留业务 · 交互式知识图谱</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #1a1a2e;
            color: #eaeaea;
            overflow: hidden;
        }
        
        /* 左侧工具栏 */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 280px;
            height: 100vh;
            background: #16213e;
            border-right: 1px solid #0f3460;
            padding: 20px;
            overflow-y: auto;
            z-index: 100;
        }
        
        .sidebar h1 {
            font-size: 18px;
            color: #e94560;
            margin-bottom: 5px;
        }
        
        .sidebar .subtitle {
            font-size: 12px;
            color: #7f8c8d;
            margin-bottom: 20px;
        }
        
        /* 搜索框 */
        .search-box {
            margin-bottom: 20px;
        }
        
        .search-box input {
            width: 100%;
            padding: 10px;
            border: 1px solid #0f3460;
            border-radius: 5px;
            background: #1a1a2e;
            color: #eaeaea;
            font-size: 14px;
        }
        
        .search-box input:focus {
            outline: none;
            border-color: #e94560;
        }
        
        /* 实体类型筛选 */
        .filter-section {
            margin-bottom: 20px;
        }
        
        .filter-section h3 {
            font-size: 14px;
            color: #e94560;
            margin-bottom: 10px;
        }
        
        .filter-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            cursor: pointer;
        }
        
        .filter-item input[type="checkbox"] {
            margin-right: 10px;
            cursor: pointer;
        }
        
        .filter-item label {
            font-size: 13px;
            cursor: pointer;
        }
        
        .filter-color {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            margin-right: 8px;
            display: inline-block;
        }
        
        /* 统计信息 */
        .stats-section {
            margin-bottom: 20px;
            padding: 15px;
            background: #0f3460;
            border-radius: 5px;
        }
        
        .stats-section h3 {
            font-size: 14px;
            color: #e94560;
            margin-bottom: 10px;
        }
        
        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 13px;
        }
        
        /* 操作按钮 */
        .action-buttons {
            margin-bottom: 20px;
        }
        
        .action-btn {
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            border: 1px solid #0f3460;
            border-radius: 5px;
            background: #1a1a2e;
            color: #eaeaea;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .action-btn:hover {
            background: #e94560;
            border-color: #e94560;
        }
        
        /* 节点详情面板 */
        .node-detail {
            position: fixed;
            right: 20px;
            top: 20px;
            width: 350px;
            max-height: 80vh;
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 10px;
            padding: 20px;
            z-index: 100;
            display: none;
            overflow-y: auto;
        }
        
        .node-detail.active {
            display: block;
        }
        
        .node-detail h2 {
            font-size: 18px;
            color: #e94560;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .node-detail .close-btn {
            background: none;
            border: none;
            color: #7f8c8d;
            font-size: 20px;
            cursor: pointer;
        }
        
        .node-detail .close-btn:hover {
            color: #e94560;
        }
        
        .node-detail .property {
            margin-bottom: 12px;
        }
        
        .node-detail .property-label {
            font-size: 12px;
            color: #7f8c8d;
            margin-bottom: 4px;
        }
        
        .node-detail .property-value {
            font-size: 14px;
            color: #eaeaea;
            padding: 8px;
            background: #1a1a2e;
            border-radius: 5px;
        }
        
        .node-detail .relations {
            margin-top: 15px;
        }
        
        .node-detail .relations h3 {
            font-size: 14px;
            color: #e94560;
            margin-bottom: 10px;
        }
        
        .node-detail .relation-item {
            font-size: 13px;
            padding: 8px;
            background: #0f3460;
            border-radius: 5px;
            margin-bottom: 5px;
            cursor: pointer;
        }
        
        .node-detail .relation-item:hover {
            background: #e94560;
        }
        
        /* 主可视化区域 */
        .visualization {
            position: fixed;
            left: 280px;
            top: 0;
            right: 0;
            bottom: 0;
            background: #1a1a2e;
        }
        
        /* SVG 样式 */
        .node {
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .node:hover {
            filter: brightness(1.3);
        }
        
        .node circle {
            stroke-width: 2px;
        }
        
        .node text {
            font-size: 12px;
            fill: #eaeaea;
            text-anchor: middle;
            pointer-events: none;
        }
        
        .link {
            stroke-opacity: 0.6;
            transition: all 0.3s;
        }
        
        .link:hover {
            stroke-opacity: 1;
            stroke-width: 3px;
        }
        
        .link-label {
            font-size: 10px;
            fill: #7f8c8d;
            pointer-events: none;
        }
        
        /* 缩放提示 */
        .zoom-tip {
            position: fixed;
            bottom: 20px;
            left: 300px;
            background: #16213e;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 12px;
            color: #7f8c8d;
            z-index: 50;
        }
        
        /* 图例 */
        .legend {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #16213e;
            padding: 15px;
            border-radius: 5px;
            z-index: 50;
        }
        
        .legend h3 {
            font-size: 12px;
            color: #e94560;
            margin-bottom: 10px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
            font-size: 11px;
        }
        
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <!-- 左侧工具栏 -->
    <div class="sidebar">
        <h1>🧠 本体论知识图谱</h1>
        <p class="subtitle">自媒体流量获客截留业务 · 14实体</p>
        
        <!-- 搜索 -->
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 搜索实体名称..." />
        </div>
        
        <!-- 实体类型筛选 -->
        <div class="filter-section">
            <h3>📦 实体类型</h3>
            <div class="filter-item">
                <span class="filter-color" style="background: #4fc3f7;"></span>
                <input type="checkbox" id="filter-core" checked />
                <label for="filter-core">核心业务对象 (8)</label>
            </div>
            <div class="filter-item">
                <span class="filter-color" style="background: #ba68c8;"></span>
                <input type="checkbox" id="filter-resource" checked />
                <label for="filter-resource">账号资源 (2)</label>
            </div>
            <div class="filter-item">
                <span class="filter-color" style="background: #ffb74d;"></span>
                <input type="checkbox" id="filter-dig" checked />
                <label for="filter-dig">挖掘策略域 (2)</label>
            </div>
            <div class="filter-item">
                <span class="filter-color" style="background: #81c784;"></span>
                <input type="checkbox" id="filter-touch" checked />
                <label for="filter-touch">触达策略域 (2)</label>
            </div>
        </div>
        
        <!-- 统计 -->
        <div class="stats-section">
            <h3>📊 统计信息</h3>
            <div class="stat-item">
                <span>实体总数</span>
                <span id="totalNodes">14</span>
            </div>
            <div class="stat-item">
                <span>关系总数</span>
                <span id="totalLinks">18</span>
            </div>
            <div class="stat-item">
                <span>当前显示</span>
                <span id="visibleNodes">14</span>
            </div>
        </div>
        
        <!-- 操作按钮 -->
        <div class="action-buttons">
            <button class="action-btn" onclick="resetView()">🔄 重置视图</button>
            <button class="action-btn" onclick="highlightPath()">✨ 高亮路径</button>
            <button class="action-btn" onclick="exportData()">💾 导出数据</button>
        </div>
        
        <!-- 使用说明 -->
        <div class="filter-section">
            <h3>💡 使用说明</h3>
            <p style="font-size: 12px; color: #7f8c8d; line-height: 1.6;">
                • 拖拽节点可移动位置<br/>
                • 点击节点查看详情<br/>
                • 滚轮缩放视图<br/>
                • 拖拽空白区域平移<br/>
                • 搜索框实时筛选<br/>
                • 点击关系跳转目标节点
            </p>
        </div>
    </div>
    
    <!-- 节点详情面板 -->
    <div class="node-detail" id="nodeDetail">
        <h2>
            <span id="detailTitle">节点名称</span>
            <button class="close-btn" onclick="closeDetail()">×</button>
        </h2>
        <div id="detailContent"></div>
    </div>
    
    <!-- 主可视化区域 -->
    <div class="visualization" id="visualization"></div>
    
    <!-- 缩放提示 -->
    <div class="zoom-tip">
        🖱️ 滚轮缩放 | 拖拽移动 | 点击查看详情
    </div>
    
    <!-- 图例 -->
    <div class="legend">
        <h3>实体类型</h3>
        <div class="legend-item">
            <div class="legend-color" style="background: #4fc3f7;"></div>
            <span>核心业务对象</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #ba68c8;"></div>
            <span>账号资源</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #ffb74d;"></div>
            <span>挖掘策略域</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #81c784;"></div>
            <span>触达策略域</span>
        </div>
    </div>
    
    <script>
        // 实体数据
        const nodes = [
            // 核心业务对象 (蓝色)
            { id: "kol", name: "KOL", type: "core", description: "流量源头", properties: { 定义: "意见领袖，拥有粉丝和影响力", 作用: "流量来源，帖子的发布者" } },
            { id: "post", name: "帖子", type: "core", description: "内容载体", properties: { 定义: "KOL发布的内容", 作用: "承载评论，发现用户的入口" } },
            { id: "comment_act", name: "评论行为", type: "core", description: "消费行为", properties: { 定义: "用户对帖子的评论行为", 包含: "谁、何时、对哪个帖子" } },
            { id: "comment_content", name: "评论内容", type: "core", description: "行为结果", properties: { 定义: "评论的具体内容", 属性: "意图评分、意图状态、语义标签", 作用: "分析用户意图的基础" } },
            { id: "collect_user", name: "采集用户", type: "core", description: "大娃负责", properties: { 状态: "待清洗→待分配→已验证→待人工→已过滤", 属性: "契合度", 负责Agent: "大娃" } },
            { id: "touch_user", name: "触达用户", type: "core", description: "二娃负责", properties: { 状态: "已分配→已触达→已转化→已关闭", 属性: "信任度、归因", 负责Agent: "二娃" } },
            { id: "traffic", name: "流量", type: "core", description: "业务结果", properties: { 定义: "最终业务目标", 作用: "获客转化的结果" } },
            { id: "verify_strategy", name: "验证策略", type: "core", description: "自动验证", properties: { 定义: "verify_users.py", 作用: "验证用户真实性", 方式: "浏览器访问主页评估活跃度" } },
            
            // 账号资源 (紫色)
            { id: "account_matrix", name: "自媒体账号矩阵", type: "resource", description: "账号资源", properties: { 定义: "具体的社媒账号资源", 用途: "触达时使用的账号", 包含: "小红书账号、抖音账号等" } },
            { id: "ip_matrix", name: "IP矩阵", type: "resource", description: "网络IP", properties: { 定义: "网络IP资源", 用途: "触达时绑定的IP", 作用: "防止账号被封" } },
            
            // 挖掘策略域 (橙色)
            { id: "dig_strategy", name: "挖掘策略", type: "dig", description: "统一策略", properties: { 定义: "发现目标的顶层策略", 包含: "采集、清洗、加工（现阶段统一）", 输出: "结构化输出" } },
            { id: "struct_output", name: "结构化输出", type: "dig", description: "能力+结果", properties: { 定义: "挖掘策略的输出", 形态: "用户画像、数据产品", 作用: "数据产品化" } },
            
            // 触达策略域 (绿色)
            { id: "touch_strategy", name: "触达策略（剧本）", type: "touch", description: "触达方式", properties: { 定义: "触达用户的策略方式", 包含: "账号绑定、IP绑定、话术、时机、行为方式、人设", MVP阶段: "与剧本合一" } },
            { id: "touch_record", name: "触达记录", type: "touch", description: "执行记录", properties: { 定义: "每次触达动作", 包含: "触达用户ID、执行账号、执行时间、话术内容", 属性: "效果（是否回复、是否转化）" } }
        ];
        
        // 关系数据
        const links = [
            { source: "kol", target: "post", label: "拥有", type: "own" },
            { source: "post", target: "comment_act", label: "承载", type: "carry" },
            { source: "comment_act", target: "comment_content", label: "产生", type: "produce" },
            { source: "comment_content", target: "collect_user", label: "意图分类", type: "classify" },
            { source: "dig_strategy", target: "post", label: "爬取", type: "crawl" },
            { source: "dig_strategy", target: "collect_user", label: "发现", type: "discover" },
            { source: "dig_strategy", target: "struct_output", label: "输出", type: "output" },
            { source: "collect_user", target: "verify_strategy", label: "验证", type: "verify" },
            { source: "verify_strategy", target: "collect_user", label: "已验证", type: "verified" },
            { source: "collect_user", target: "touch_user", label: "转化为", type: "transform" },
            { source: "touch_strategy", target: "account_matrix", label: "绑定", type: "bind" },
            { source: "touch_strategy", target: "ip_matrix", label: "绑定", type: "bind" },
            { source: "touch_strategy", target: "touch_user", label: "执行", type: "execute" },
            { source: "touch_user", target: "touch_record", label: "产生", type: "produce" },
            { source: "touch_record", target: "touch_user", label: "反馈信任度", type: "feedback" },
            { source: "touch_user", target: "traffic", label: "转化", type: "convert" },
            { source: "touch_user", target: "kol", label: "归因追溯", type: "attribute" },
            { source: "touch_user", target: "touch_strategy", label: "归因追溯", type: "attribute" }
        ];
        
        // 颜色映射
        const colorMap = {
            core: "#4fc3f7",
            resource: "#ba68c8",
            dig: "#ffb74d",
            touch: "#81c784"
        };
        
        // 关系颜色
        const linkColorMap = {
            own: "#e94560",
            carry: "#4fc3f7",
            produce: "#81c784",
            classify: "#ffb74d",
            crawl: "#ffb74d",
            discover: "#ffb74d",
            output: "#ffb74d",
            verify: "#4fc3f7",
            verified: "#81c784",
            transform: "#e94560",
            bind: "#ba68c8",
            execute: "#81c784",
            feedback: "#81c784",
            convert: "#81c784",
            attribute: "#7f8c8d"
        };
        
        // 初始化SVG
        const width = window.innerWidth - 280;
        const height = window.innerHeight;
        
        const svg = d3.select("#visualization")
            .append("svg")
            .attr("width", width)
            .attr("height", height);
        
        // 添加缩放功能
        const zoom = d3.zoom()
            .scaleExtent([0.3, 3])
            .on("zoom", (event) => {
                g.attr("transform", event.transform);
            });
        
        svg.call(zoom);
        
        const g = svg.append("g");
        
        // 创建力导向图
        const simulation = d3.forceSimulation(nodes)
            .force("link", d3.forceLink(links).id(d => d.id).distance(150))
            .force("charge", d3.forceManyBody().strength(-400))
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("collision", d3.forceCollide().radius(50));
        
        // 绘制关系线
        const link = g.append("g")
            .selectAll("line")
            .data(links)
            .enter()
            .append("line")
            .attr("class", "link")
            .attr("stroke", d => linkColorMap[d.type] || "#7f8c8d")
            .attr("stroke-width", 2);
        
        // 绘制关系标签
        const linkLabel = g.append("g")
            .selectAll("text")
            .data(links)
            .enter()
            .append("text")
            .attr("class", "link-label")
            .attr("text-anchor", "middle")
            .text(d => d.label);
        
        // 绘制节点
        const node = g.append("g")
            .selectAll("g")
            .data(nodes)
            .enter()
            .append("g")
            .attr("class", "node")
            .call(d3.drag()
                .on("start", dragStarted)
                .on("drag", dragged)
                .on("end", dragEnded))
            .on("click", showDetail);
        
        // 节点圆形
        node.append("circle")
            .attr("r", 30)
            .attr("fill", d => colorMap[d.type])
            .attr("stroke", d => colorMap[d.type])
            .attr("stroke-width", 3);
        
        // 节点文字
        node.append("text")
            .attr("dy", 4)
            .text(d => d.name);
        
        // 更新位置
        simulation.on("tick", () => {
            link
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);
            
            linkLabel
                .attr("x", d => (d.source.x + d.target.x) / 2)
                .attr("y", d => (d.source.y + d.target.y) / 2);
            
            node.attr("transform", d => `translate(${d.x},${d.y})`);
        });
        
        // 拖拽函数
        function dragStarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }
        
        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }
        
        function dragEnded(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }
        
        // 显示节点详情
        function showDetail(event, d) {
            const detail = document.getElementById("nodeDetail");
            const title = document.getElementById("detailTitle");
            const content = document.getElementById("detailContent");
            
            title.textContent = d.name;
            
            let html = `
                <div class="property">
                    <div class="property-label">类型</div>
                    <div class="property-value">${d.description}</div>
                </div>
            `;
            
            // 显示属性
            if (d.properties) {
                for (const [key, value] of Object.entries(d.properties)) {
                    html += `
                        <div class="property">
                            <div class="property-label">${key}</div>
                            <div class="property-value">${value}</div>
                        </div>
                    `;
                }
            }
            
            // 显示关系
            const relations = links.filter(l => l.source.id === d.id || l.target.id === d.id);
            if (relations.length > 0) {
                html += `
                    <div class="relations">
                        <h3>🔗 相关关系 (${relations.length})</h3>
                `;
                
                relations.forEach(r => {
                    const targetName = r.source.id === d.id ? r.target.name : r.source.name;
                    const direction = r.source.id === d.id ? "→" : "←";
                    html += `
                        <div class="relation-item" onclick="highlightNode('${r.source.id === d.id ? r.target.id : r.source.id}')">
                            ${direction} ${r.label} ${targetName}
                        </div>
                    `;
                });
                
                html += "</div>";
            }
            
            content.innerHTML = html;
            detail.classList.add("active");
            
            // 高亮当前节点
            highlightNode(d.id);
        }
        
        // 关闭详情
        function closeDetail() {
            document.getElementById("nodeDetail").classList.remove("active");
            resetHighlight();
        }
        
        // 高亮节点
        function highlightNode(nodeId) {
            node.selectAll("circle")
                .attr("stroke-width", d => d.id === nodeId ? 6 : 3)
                .attr("filter", d => d.id === nodeId ? "brightness(1.5)" : "none");
            
            link
                .attr("stroke-width", d => (d.source.id === nodeId || d.target.id === nodeId) ? 4 : 2)
                .attr("stroke-opacity", d => (d.source.id === nodeId || d.target.id === nodeId) ? 1 : 0.6);
        }
        
        // 重置高亮
        function resetHighlight() {
            node.selectAll("circle")
                .attr("stroke-width", 3)
                .attr("filter", "none");
            
            link
                .attr("stroke-width", 2)
                .attr("stroke-opacity", 0.6);
        }
        
        // 重置视图
        function resetView() {
            svg.transition()
                .duration(500)
                .call(zoom.transform, d3.zoomIdentity);
            
            simulation.alpha(1).restart();
            closeDetail();
        }
        
        // 高亮路径
        function highlightPath() {
            // 高亮从KOL到流量的完整路径
            const pathNodes = ["kol", "post", "comment_act", "comment_content", "collect_user", "touch_user", "traffic"];
            
            node.selectAll("circle")
                .attr("stroke-width", d => pathNodes.includes(d.id) ? 6 : 2)
                .attr("filter", d => pathNodes.includes(d.id) ? "brightness(1.5)" : "none");
            
            link
                .attr("stroke-width", d => (pathNodes.includes(d.source.id) && pathNodes.includes(d.target.id)) ? 4 : 1)
                .attr("stroke-opacity", d => (pathNodes.includes(d.source.id) && pathNodes.includes(d.target.id)) ? 1 : 0.3);
        }
        
        // 导出数据
        function exportData() {
            const data = {
                nodes: nodes,
                links: links.map(l => ({
                    source: l.source.id || l.source,
                    target: l.target.id || l.target,
                    label: l.label,
                    type: l.type
                }))
            };
            
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "本体论-知识图谱数据.json";
            a.click();
            URL.revokeObjectURL(url);
        }
        
        // 搜索功能
        document.getElementById("searchInput").addEventListener("input", function(e) {
            const searchTerm = e.target.value.toLowerCase();
            
            node.selectAll("circle")
                .attr("opacity", d => d.name.toLowerCase().includes(searchTerm) || searchTerm === "" ? 1 : 0.2);
            
            node.selectAll("text")
                .attr("opacity", d => d.name.toLowerCase().includes(searchTerm) || searchTerm === "" ? 1 : 0.2);
            
            link
                .attr("opacity", d => {
                    const sourceMatch = d.source.name.toLowerCase().includes(searchTerm);
                    const targetMatch = d.target.name.toLowerCase().includes(searchTerm);
                    return (sourceMatch || targetMatch || searchTerm === "") ? 1 : 0.2;
                });
            
            // 更新可见数量
            const visibleCount = nodes.filter(n => n.name.toLowerCase().includes(searchTerm) || searchTerm === "").length;
            document.getElementById("visibleNodes").textContent = visibleCount;
        });
        
        // 类型筛选
        document.querySelectorAll(".filter-item input[type='checkbox']").forEach(cb => {
            cb.addEventListener("change", function() {
                const activeTypes = [];
                if (document.getElementById("filter-core").checked) activeTypes.push("core");
                if (document.getElementById("filter-resource").checked) activeTypes.push("resource");
                if (document.getElementById("filter-dig").checked) activeTypes.push("dig");
                if (document.getElementById("filter-touch").checked) activeTypes.push("touch");
                
                node.selectAll("circle")
                    .attr("opacity", d => activeTypes.includes(d.type) ? 1 : 0.2);
                
                node.selectAll("text")
                    .attr("opacity", d => activeTypes.includes(d.type) ? 1 : 0.2);
                
                link
                    .attr("opacity", d => {
                        const sourceActive = activeTypes.includes(d.source.type);
                        const targetActive = activeTypes.includes(d.target.type);
                        return (sourceActive && targetActive) ? 1 : 0.2;
                    });
                
                // 更新可见数量
                const visibleCount = nodes.filter(n => activeTypes.includes(n.type)).length;
                document.getElementById("visibleNodes").textContent = visibleCount;
            });
        });
        
        // 初始化显示
        document.getElementById("totalNodes").textContent = nodes.length;
        document.getElementById("totalLinks").textContent = links.length;
        document.getElementById("visibleNodes").textContent = nodes.length;
    </script>
</body>
</html>
